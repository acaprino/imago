[package]
name = "imago-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Rust side of Imago's desktop shell: glass window, window theme, Snap Layouts, navigation guard, WebView2 recovery and window state"

# Every version is the one Shinatama's Cargo.lock resolves (2026-11-20), so the apps of the suite
# link one copy of each. Features are the ones Shinatama's desktop crate enables.
[dependencies]
tauri = "=2.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# The Win32 areas src/frame.rs calls (the Snap Layouts child window, the reload item of the window
# menu, which subclasses the window with Win32_UI_Shell), and no more.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The WebView2 settings and events Tauri does not expose (src/guard.rs, src/recovery.rs): exactly the
# versions tauri-runtime-wry links, so the executable holds one WebView2 binding.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[dev-dependencies]
tempfile = "=3.27.0"
