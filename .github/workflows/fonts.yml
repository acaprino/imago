name: Fonts (throwaway, branch shell-react only)

on:
  push:
    branches: [shell-react]
    paths: ['.github/workflows/fonts.yml', '.github/fonts.mjs']

permissions:
  contents: read

jobs:
  fonts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run demo:web
      - shell: pwsh
        run: Get-ChildItem C:\Windows\Fonts -Filter 'seg*' | Select-Object -ExpandProperty Name
      - run: cp .github/fonts.mjs fonts-run.mjs && node fonts-run.mjs
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: fonts
          path: fonts
          retention-days: 7
