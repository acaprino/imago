name: Verify

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # rustup resolves and installs the channel, components and target in rust-toolchain.toml.
      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: npm ci

      # The gallery test drives a browser.
      - name: Install the browser
        run: npx playwright install chromium

      - name: Verify
        run: npm run verify
