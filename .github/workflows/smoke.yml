name: Smoke (throwaway, branch shell-react only)

on:
  push:
    branches: [shell-react]
    paths: ['.github/workflows/smoke.yml', '.github/smoke.ps1', '.github/smoke-page.mjs']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sources: [before, after]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      # The same checks on the sources before the fix, which must fail two of them.
      - if: matrix.sources == 'before'
        run: git checkout 0d9dda8d7317fdf1e62cd42111a87c4b749e2a7f -- ts crates examples/demo
      - run: rustup show active-toolchain
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: none
          restore-keys: |
            ${{ runner.os }}-cargo-demo-
      - run: npm ci
      # The engine does not take the port from the environment here (the runner is elevated): the window asks for it.
      - run: |
          $conf = 'examples/demo/src-tauri/tauri.conf.json'
          (Get-Content $conf -Raw).Replace('"decorations": false', '"decorations": false, "additionalBrowserArgs": "--remote-debugging-port=9333 --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection"') | Set-Content $conf
      - run: npm run demo:build
      - timeout-minutes: 8
        run: ./.github/smoke.ps1 -Exe "$PWD/target/debug/imago-demo.exe" -Data "$env:RUNNER_TEMP/demo-data" -Out "$env:RUNNER_TEMP/smoke"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.sources }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 30
