name: Gray text (throwaway, branch shell-polish only)

on:
  push:
    branches: [shell-polish]
    paths: ['.github/workflows/gray.yml', '.github/gray.ps1']

permissions:
  contents: read

jobs:
  gray:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sources: [before, after]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - if: matrix.sources == 'before'
        run: git checkout c1d29e0 -- crates
      - run: rustup show active-toolchain
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: none
          restore-keys: |
            ${{ runner.os }}-cargo-demo-
      - run: npm ci
      - run: npm run demo:build
      - timeout-minutes: 8
        run: ./.github/gray.ps1 -Exe "$PWD/target/debug/imago-demo.exe" -Data "$env:RUNNER_TEMP/demo-data" -Out "$env:RUNNER_TEMP/gray"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gray-${{ matrix.sources }}
          path: ${{ runner.temp }}/gray
          if-no-files-found: ignore
          retention-days: 30
