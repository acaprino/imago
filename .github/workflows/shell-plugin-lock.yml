name: Lock (throwaway, branch shell-plugin only)

on:
  push:
    branches: [shell-plugin]
    paths: ['.github/workflows/shell-plugin-lock.yml']

permissions:
  contents: read

jobs:
  lock:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # Adds what is missing and moves nothing else.
      - run: cargo fetch
      - run: git diff --stat; git diff Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - run: cargo fmt --all --check
