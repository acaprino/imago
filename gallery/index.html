<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imago gallery</title>
</head>
<body>
  <header class="g-bar">
    <div class="g-bar-in">
      <span class="g-name">Imago</span>
      <div class="g-ctl"><span id="g-l-app">App</span><div class="g-pick" role="group" aria-labelledby="g-l-app" data-g-pick="app"></div></div>
      <div class="g-ctl"><span id="g-l-look">Look</span><div class="g-pick" role="group" aria-labelledby="g-l-look" data-g-pick="look"></div></div>
      <div class="g-ctl"><span id="g-l-theme">Theme</span><div class="g-pick" role="group" aria-labelledby="g-l-theme" data-g-pick="theme"></div></div>
      <div class="g-ctl"><span id="g-l-glass">Glass</span><div class="g-pick" role="group" aria-labelledby="g-l-glass" data-g-pick="glass"></div></div>
    </div>
  </header>
  <main class="g-page">
    <section class="g-block" aria-labelledby="g-h-window">
      <h1 id="g-h-window">The window</h1>
      <div class="g-width">
        <label for="g-width">Window width</label>
        <input type="range" id="g-width" min="250" max="1160" step="10" value="1160">
        <output for="g-width" id="g-width-out">1160 px</output>
      </div>
      <ul class="g-rules" id="g-rules" aria-live="polite"></ul>
      <div class="g-stage" id="g-stage">
        <div class="g-window" id="g-window"></div>
      </div>
    </section>
    <div id="g-sections"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
